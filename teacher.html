<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Portal | Hope Online Tuition School</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="images/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700;800&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body class="admin-page teacher-page">

  <div class="portal-lang">
    <button class="lang-switch" type="button" aria-label="Switch language / ဘာသာစကား ပြောင်းရန်" data-no-translate><span data-lang="en">EN</span><span data-lang="my">မြန်မာ</span></button>
  </div>

  <main class="admin-main">
    <!-- ===== Choose a new password ===== -->
    <section id="t-change" class="admin-login" hidden>
      <div class="card login-card change-card">
        <h1>Choose a new password</h1>
        <p class="portal-hint" id="t-change-intro">Please replace your temporary password with one only you know.</p>
        <form id="t-change-form" novalidate>
          <div class="field">
            <label for="t-pw-current">Current password</label>
            <input id="t-pw-current" type="password" autocomplete="current-password" required>
          </div>
          <div class="field">
            <label for="t-pw-new">New password (at least 8 characters)</label>
            <input id="t-pw-new" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="field">
            <label for="t-pw-confirm">Type the new password again</label>
            <input id="t-pw-confirm" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <p class="admin-error" id="t-change-error" role="alert" hidden></p>
          <button type="submit" class="btn btn--gold" style="width:100%">Save password</button>
          <button type="button" class="btn btn--outline" style="width:100%" id="t-change-cancel" hidden>Back</button>
          <button type="button" class="btn btn--outline" style="width:100%" id="t-change-signout" hidden>Sign out</button>
        </form>
      </div>
    </section>

    <!-- ===== Teacher portal ===== -->
    <section id="t-dash" hidden>
      <header class="admin-top">
        <div>
          <span class="eyebrow">Teacher portal</span>
          <h1 id="t-hello" data-no-translate>Hello</h1>
        </div>
        <div class="admin-top-actions">
          <span class="admin-who" id="t-who" data-no-translate></span>
          <button type="button" class="btn btn--outline btn--sm" id="t-open-change">Change password</button>
          <button type="button" class="btn btn--outline btn--sm" id="t-sign-out">Sign out</button>
        </div>
      </header>

      <nav class="admin-tabs" role="tablist">
        <button type="button" role="tab" data-tab="lessons" aria-selected="true">Lessons <span class="tab-count" id="t-mark-count" hidden data-no-translate></span></button>
        <button type="button" role="tab" data-tab="attendance" aria-selected="false">Attendance</button>
        <button type="button" role="tab" data-tab="students" aria-selected="false">My students</button>
      </nav>
      <p class="admin-error" id="t-error" role="alert" hidden data-no-translate></p>

      <!-- Lessons -->
      <div class="admin-panel" data-panel="lessons">
        <form class="card lesson-add" id="lesson-add" novalidate>
          <h3>Add lessons</h3>
          <div class="field"><label for="la-student">Student</label><select id="la-student" required data-no-translate></select></div>
          <div class="field"><label for="la-date">Date</label><input id="la-date" type="date" required></div>
          <div class="field"><label for="la-time">Start time</label><input id="la-time" type="time" required></div>
          <div class="field"><label for="la-length">Minutes</label><input id="la-length" type="number" min="15" max="240" step="5" value="90" required></div>
          <div class="field"><label for="la-repeat">Repeat</label>
            <select id="la-repeat">
              <option value="1">Once</option>
              <option value="4">Weekly for 4 weeks</option>
              <option value="8">Weekly for 8 weeks</option>
              <option value="12">Weekly for 12 weeks</option>
            </select>
          </div>
          <div class="field"><label for="la-makeup">Make-up for</label><select id="la-makeup" data-no-translate></select></div>
          <button type="submit" class="btn btn--gold">Add lessons</button>
        </form>

        <div class="panel-bar">
          <h2 class="portal-section-title">Needs marking</h2>
          <button type="button" class="btn btn--outline btn--sm" data-refresh>Refresh</button>
        </div>
        <div id="t-to-mark" class="lesson-list" data-no-translate></div>

        <h2 class="portal-section-title lesson-heading">Upcoming</h2>
        <div id="t-upcoming" class="lesson-list" data-no-translate></div>

        <h2 class="portal-section-title lesson-heading">Last 5 weeks</h2>
        <div id="t-past" class="lesson-list" data-no-translate></div>
      </div>

      <!-- Attendance -->
      <div class="admin-panel" data-panel="attendance" hidden>
        <div class="panel-bar">
          <label for="t-month">Month</label>
          <input id="t-month" type="month" class="month-input">
          <button type="button" class="btn btn--outline btn--sm" data-refresh>Refresh</button>
        </div>
        <p class="small-note">Attendance rate = lessons attended ÷ lessons marked. Cancelled and make-up lessons are not counted. Students should keep at least 80%.</p>
        <div class="table-wrap" id="t-attendance" data-no-translate></div>
      </div>

      <!-- My students -->
      <div class="admin-panel" data-panel="students" hidden>
        <div class="panel-bar">
          <button type="button" class="btn btn--outline btn--sm" data-refresh>Refresh</button>
        </div>
        <div id="t-students" class="teacher-students" data-no-translate></div>
      </div>
    </section>
  </main>

  <p class="admin-toast" id="toast" role="status" hidden data-no-translate></p>

  <script src="js/translations.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/main.js"></script>
  <script src="js/teacher.js"></script>
</body>
</html>
