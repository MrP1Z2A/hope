<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Portal | Hope Online Tuition School</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="images/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700;800&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body class="admin-page student-page">

  <div class="portal-lang">
    <button class="lang-switch" type="button" aria-label="Switch language / ဘာသာစကား ပြောင်းရန်" data-no-translate><span data-lang="en">EN</span><span data-lang="my">မြန်မာ</span></button>
  </div>

  <main class="admin-main">
    <!-- ===== Choose a new password ===== -->
    <section id="s-change" class="admin-login" hidden>
      <div class="card login-card change-card">
        <h1>Choose a new password</h1>
        <p class="portal-hint" id="s-change-intro">Please replace your temporary password with one only you know.</p>
        <form id="s-change-form" novalidate>
          <div class="field">
            <label for="s-pw-current">Current password</label>
            <input id="s-pw-current" type="password" autocomplete="current-password" required>
          </div>
          <div class="field">
            <label for="s-pw-new">New password (at least 8 characters)</label>
            <input id="s-pw-new" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="field">
            <label for="s-pw-confirm">Type the new password again</label>
            <input id="s-pw-confirm" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <p class="admin-error" id="s-change-error" role="alert" hidden></p>
          <button type="submit" class="btn btn--gold" style="width:100%">Save password</button>
          <button type="button" class="btn btn--outline" style="width:100%" id="s-change-cancel" hidden>Back</button>
          <button type="button" class="btn btn--outline" style="width:100%" id="s-change-signout" hidden>Sign out</button>
        </form>
      </div>
    </section>

    <!-- ===== Student portal ===== -->
    <section id="s-dash" hidden>
      <header class="admin-top">
        <div>
          <span class="eyebrow">Student portal</span>
          <h1 id="s-hello" data-no-translate>Hello</h1>
        </div>
        <div class="admin-top-actions">
          <span class="admin-who" id="s-who" data-no-translate></span>
          <button type="button" class="btn btn--outline btn--sm" id="s-open-change">Change password</button>
          <button type="button" class="btn btn--outline btn--sm" id="s-sign-out">Sign out</button>
        </div>
      </header>

      <div class="card chat-card">
        <div class="chat-head">
          <h2>Student chat</h2>
          <p>Talk with other Hope students. Be kind and respectful. Hope Education staff can see this chat.</p>
        </div>
        <div class="chat-list" id="chat-list" aria-live="polite" data-no-translate></div>
        <p class="chat-error" id="chat-error" role="alert" hidden data-no-translate></p>
        <form class="chat-form" id="chat-form" novalidate>
          <label for="chat-input" class="visually-hidden">Message</label>
          <textarea id="chat-input" maxlength="1000" placeholder="Write a message…" required></textarea>
          <button type="submit" class="btn btn--gold">Send</button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/translations.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/main.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
